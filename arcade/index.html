<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080f19">
  <meta name="description" content="A portrait arcade space shooter. Break through the blockade, fly your own way, and build a fleet with earned Salvage.">
  <title>Stellar Rebels</title>
  <link rel="icon" href="media/brand/icon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="media/brand/icon-180.png">
  <link rel="stylesheet" href="flight.css">
  <script defer src="/src/00-runtime.js"></script>
  <script defer src="/src/00-input-actions.js"></script>
  <script defer src="/src/00-gameplay-rules.js"></script>
  <script defer src="/src/00-asset-manifest.js"></script>
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <main class="frame" id="frame">
    <section class="menu" id="menu" aria-label="Stellar Rebels">
      <div class="boot"><img src="media/brand/emblem-light.svg" alt="" width="58" height="58"><p>Stellar Rebels</p></div>
      <noscript><p>Enable JavaScript to fly.</p></noscript>
    </section>
    <section class="flight" id="flight" aria-label="Flight" hidden>
      <canvas id="sky" aria-label="Flight playfield. Drag to steer or use arrow keys. Weapons fire automatically."></canvas>
      <div class="flight-ui">
        <div class="instrument">
          <div class="hull"><span class="caption">Hull</span><div id="hull" role="meter" aria-label="Hull" aria-valuemin="0" aria-valuemax="5" aria-valuenow="5"></div></div>
          <div class="flight-label"><span id="flight-name">Vesper Orbit</span><span id="clock" class="caption">00:00</span><span id="flight-tip" hidden></span></div>
          <button id="pause" class="icon-button" type="button" aria-label="Pause"></button>
        </div>
        <div class="run-line"><span id="flight-score">0</span><span id="flight-progress"></span><span id="chain"></span></div>
        <div id="boss-meter" class="boss-hud" hidden><span id="boss-name"></span><div id="boss-track" role="meter" aria-label="Boss hull" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div id="boss-value"></div></div></div>
        <div class="flight-footer"><div id="field-effects"></div><p id="flight-help">Drag to steer · Weapons fire automatically</p></div>
      </div>
      <dialog id="flight-modal" aria-labelledby="pause-title"></dialog>
    </section>
    <p id="announcer" class="visually-hidden" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
