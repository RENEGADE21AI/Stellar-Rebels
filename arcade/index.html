<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080f19">
  <meta name="description" content="A portrait arcade space shooter. Break through the blockade, fly your own way, and build a fleet with earned Salvage.">
  <title>Stellar Rebels</title>
  <link rel="icon" href="media/brand/icon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="media/brand/icon-180.png">
  <link rel="stylesheet" href="flight.css">
  <script defer src="/src/00-runtime.js"></script>
  <script defer src="/src/00-input-actions.js"></script>
  <script defer src="/src/00-gameplay-rules.js"></script>
  <script defer src="/src/00-asset-manifest.js"></script>
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <main class="frame" id="frame">
    <section class="menu" id="menu" aria-label="Stellar Rebels">
      <div class="boot"><img src="media/brand/emblem-light.svg" alt="" width="58" height="58"><p>Stellar Rebels</p></div>
      <noscript><p>Enable JavaScript to fly.</p></noscript>
    </section>
    <section class="flight" id="flight" aria-label="Flight" hidden>
      <canvas id="sky" aria-label="Flight playfield. Drag or use arrow keys to steer. Weapons fire automatically. Press Space for Ghost Shift."></canvas>
      <div class="flight-ui">
        <div class="hull">
          <div id="hull" role="meter" aria-label="Hull" aria-valuemin="0" aria-valuemax="5" aria-valuenow="5"></div>
          <div id="ghost-meter" role="meter" aria-label="Energy" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="ghost-value"></div></div>
        </div>
        <div class="flight-controls">
          <div id="ghost-control" class="ghost-control">
            <button id="ghost-shift" type="button" aria-label="Ghost Shift" aria-describedby="ghost-status" aria-disabled="true">
              <span id="ghost-label" class="caption">Ghost</span><strong id="ghost-action">Shift</strong>
            </button>
            <span id="ghost-status" class="visually-hidden">Hit enemies to charge Ghost Shift.</span>
          </div>
          <div class="flight-points"><span class="visually-hidden">Score</span><span id="flight-score">0</span><span id="chain"></span></div>
          <button id="pause" class="icon-button" type="button" aria-label="Pause"></button>
        </div>
        <div id="flight-message" class="flight-label">
          <div class="flight-heading"><span id="flight-name" hidden></span><span id="boss-name" hidden></span><span id="boss-realm" aria-live="polite" hidden></span></div>
          <div class="run-status">
            <span id="flight-tip" hidden></span><span id="flight-progress" hidden></span><p id="flight-help" hidden>Drag to steer · Auto-fire</p><div id="field-effects" hidden></div>
          </div>
        </div>
        <span id="clock" class="visually-hidden">00:00</span>
        <div id="boss-meter" class="visually-hidden" hidden><div id="boss-track" role="meter" aria-label="Boss hull" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div id="boss-value"></div></div></div>
      </div>
      <div id="training-actions" class="training-actions" hidden></div>
      <dialog id="flight-modal" aria-labelledby="pause-title"></dialog>
    </section>
    <p id="announcer" class="visually-hidden" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
